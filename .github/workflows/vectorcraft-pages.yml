name: Deploy VectorCraft to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'custom-build/**'
      - 'host/**'
      - 'font-library/**'
      - 'scripts/prepare_vectorcraft.py'
      - 'scripts/build_font_catalog.py'
      - '.github/workflows/vectorcraft-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vectorcraft-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare static site
        run: |
          python scripts/build_font_catalog.py
          python scripts/prepare_vectorcraft.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
